<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PaperScout – Prototyp</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f3f4f6; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
    --soft:#f8fafc; --soft2:#f3f4f6; --inv:#fff;
    --brand:#1d4ed8; --brand-soft:#dbeafe; --brand-line:#bfdbfe; --btn:#1d4ed8;
    --good:#16a34a; --good-soft:#dcfce7; --good-ink:#166534;
    --warn:#d97706; --warn-soft:#fef3c7; --warn-ink:#92400e;
    --bad:#dc2626; --bad-soft:#fee2e2; --bad-ink:#991b1b; --bad-line:#fecaca;
    --neutral-ink:#374151; --toast-bg:#111827; --toast-ink:#fff;
    --side-w:320px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0f172a; --card:#1e293b; --ink:#e5e7eb; --muted:#9ca3af; --line:#334155;
      --soft:#243044; --soft2:#334155; --inv:#0f172a;
      --brand:#60a5fa; --brand-soft:#1e3a8a; --brand-line:#1d4ed8; --btn:#2563eb;
      --good:#22c55e; --good-soft:#14532d; --good-ink:#bbf7d0;
      --warn:#f59e0b; --warn-soft:#78350f; --warn-ink:#fde68a;
      --bad:#ef4444; --bad-soft:#7f1d1d; --bad-ink:#fecaca; --bad-line:#991b1b;
      --neutral-ink:#d1d5db; --toast-bg:#e5e7eb; --toast-ink:#111827;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0f172a; --card:#1e293b; --ink:#e5e7eb; --muted:#9ca3af; --line:#334155;
    --soft:#243044; --soft2:#334155; --inv:#0f172a;
    --brand:#60a5fa; --brand-soft:#1e3a8a; --brand-line:#1d4ed8; --btn:#2563eb;
    --good:#22c55e; --good-soft:#14532d; --good-ink:#bbf7d0;
    --warn:#f59e0b; --warn-soft:#78350f; --warn-ink:#fde68a;
    --bad:#ef4444; --bad-soft:#7f1d1d; --bad-ink:#fecaca; --bad-line:#991b1b;
    --neutral-ink:#d1d5db; --toast-bg:#e5e7eb; --toast-ink:#111827;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.45}
  .app{display:flex;min-height:100dvh}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
  .topbar .mark{width:32px;height:32px;border-radius:9px;background:var(--btn);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
  .topbar h1{font-size:16px;margin:0;flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .back{border:1px solid var(--line);background:var(--card);width:34px;height:34px;border-radius:9px;font-size:18px;cursor:pointer;color:var(--ink);flex:none}
  .menu-btn{border:1px solid var(--line);background:var(--card);height:34px;padding:0 10px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:600;display:none;align-items:center;gap:6px;flex:none}
  .menu-btn .dotlive{width:8px;height:8px;border-radius:50%;background:var(--good)}
  .menu-btn .dotlive.busy{background:var(--warn);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .content{padding:16px;max-width:760px;width:100%;margin:0 auto;padding-bottom:80px}
  .screen{display:none}.screen.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;color:var(--ink)}
  .card.soft{background:var(--soft)}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
  .btn.primary{background:var(--btn);color:#fff}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .btn + .btn{margin-top:10px}
  .muted{color:var(--muted);font-size:14px}.small{font-size:13px}
  h2{font-size:13px;margin:18px 0 8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;resize:none;outline:none;background:var(--card);color:var(--ink)}
  textarea::placeholder{color:var(--muted)}
  textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .chip{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;cursor:pointer;color:var(--ink);display:flex;gap:8px;width:100%;margin-top:8px;font-family:inherit}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.good{background:var(--good-soft);color:var(--good-ink)}.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
  .pill.bad{background:var(--bad-soft);color:var(--bad-ink)}.pill.neutral{background:var(--soft2);color:var(--neutral-ink)}
  .score{width:44px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:18px;line-height:1;flex:none;color:#fff}
  .score small{font-size:9px;font-weight:600;opacity:.9;margin-top:2px}
  .s-high{background:#16a34a}.s-mid{background:#d97706}.s-low{background:#dc2626}.s-x{background:#9ca3af}
  .score.big{width:72px;height:72px;font-size:30px;border-radius:18px}
  .score.big small{font-size:11px}
  .row{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  .row .body{flex:1;min-width:0}
  .row .title{font-weight:600;font-size:15px;margin:0 0 2px}
  .row .meta{font-size:13px;color:var(--muted);margin:0 0 6px}
  .row .why{font-size:13px;margin:0}
  .row .arrow{color:var(--muted);flex:none;padding-top:10px}
  .tabs{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;color:var(--ink)}
  .tab.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
  .crit{padding:10px 0;border-bottom:1px solid var(--line)}
  .crit:last-child{border-bottom:0}
  .crit .top{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:10px}
  .crit .top b{font-weight:700;flex:none}
  .crit .bar{height:8px;border-radius:999px;background:var(--soft2);margin:6px 0 4px;overflow:hidden}
  .crit .bar i{display:block;height:100%;border-radius:999px}
  .crit .exp{font-size:13px;color:var(--muted)}
  .alert{background:var(--bad-soft);border:1px solid var(--bad-line);border-radius:12px;padding:12px;font-size:15px;color:var(--ink)}
  .alert b{display:block;margin-bottom:4px}
  .link{color:var(--brand);text-decoration:none;font-weight:500;word-break:break-all}
  .citation{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px;line-height:1.5;color:var(--ink)}
  .log{font-size:15px}
  .log .ln{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateY(4px);transition:all .3s}
  .log .ln.on{opacity:1;transform:none}
  .log .ln:last-child{border-bottom:0}
  .log .ico{flex:none;width:22px;text-align:center}
  .spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .summary .st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .summary .st .n{font-size:22px;font-weight:800}
  .summary .st .l{font-size:12px;color:var(--muted)}
  aside{width:var(--side-w);flex:none;background:var(--card);border-left:1px solid var(--line);position:sticky;top:0;height:100dvh;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
  .side-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 8px;display:flex;justify-content:space-between;align-items:center}
  .close-side{display:none;border:0;background:var(--soft2);width:30px;height:30px;border-radius:8px;font-size:16px;cursor:pointer;color:var(--ink)}
  .side-foot{margin-top:auto;padding-top:14px;padding-right:64px;font-size:13px;color:var(--muted)}
  .step{display:flex;gap:10px;padding:9px 8px;border-radius:10px;position:relative}
  .step .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex:none;background:var(--card)}
  .step .t{font-size:14px;font-weight:600;color:var(--muted)}
  .step .d{font-size:12px;color:var(--muted);margin-top:1px}
  .step .act{font-size:12px;color:var(--brand);font-weight:600;margin-top:3px;display:none}
  .step.done .n{background:var(--good);border-color:var(--good);color:#fff}
  .step.done .t{color:var(--ink)}
  .step.active .n{border-color:var(--brand);color:var(--brand);animation:pulse 1.2s infinite}
  .step.active .t{color:var(--brand)}
  .step.clickable{cursor:pointer}
  .step.clickable:hover{background:var(--soft)}
  .step.clickable .act{display:block}
  .step.current{background:var(--brand-soft)}
  .vline{position:absolute;left:20px;top:36px;width:2px;height:calc(100% - 28px);background:var(--line)}
  .step:last-child .vline{display:none}
  .proj{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .proj:hover{background:var(--soft)}
  .proj.on{background:var(--brand-soft);border-color:var(--brand-line)}
  .proj .ico{width:30px;height:30px;border-radius:8px;background:var(--soft2);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
  .proj .pt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .proj .pd{font-size:12px;color:var(--muted)}
  #scrim{display:none;position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:25}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:var(--toast-ink);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:60;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .flag{width:22px;height:15px;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
  .flag svg{display:block;width:100%;height:100%}
  #langWrap{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:70}
  #langBtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.12)}
  #langBtn .flag{width:24px;height:16px}
  #langMenu{position:absolute;right:0;bottom:46px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:180px;box-shadow:0 10px 30px rgba(0,0,0,.16);display:none}
  #langMenu.open{display:block}
  #langMenu .lh{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 10px 4px}
  .lopt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);text-align:left}
  .lopt:hover{background:var(--soft2)}
  .lopt.on{background:var(--brand-soft);font-weight:600}
  .lopt .chk{margin-left:auto;color:var(--brand);font-weight:700}
  @media (max-width:899px){
    aside{position:fixed;right:0;top:0;width:min(86vw,340px);transform:translateX(100%);transition:transform .25s;z-index:30;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
    aside.open{transform:none}
    .menu-btn{display:inline-flex}
    .close-side{display:block}
    #scrim.show{display:block}
  }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="topbar">
      <button class="back" id="backBtn" onclick="goBack()" style="display:none">‹</button>
      <div class="mark" onclick="newProject()" style="cursor:pointer">P</div>
      <h1 id="topTitle">PaperScout</h1>
      <button class="menu-btn" onclick="openSide()"><span class="dotlive" id="liveDot"></span> <span data-i18n="menu"></span></button>
    </div>

    <div class="content">

      <!-- ===== SCREEN 1: THEMA ===== -->
      <section id="start" class="screen active">
        <p style="font-size:22px;font-weight:700;margin:14px 0 4px" data-i18n="start_h"></p>
        <p class="muted" style="margin:0 0 14px" data-i18n="start_p"></p>
        <textarea id="query" data-i18n-ph="start_ph"></textarea>
        <div class="muted small" style="margin-top:10px" data-i18n="examples_l"></div>
        <button class="chip" onclick="useExample(0)"><span>📱</span><span data-i18n="ex0"></span></button>
        <button class="chip" onclick="useExample(1)"><span>💤</span><span data-i18n="ex1"></span></button>
        <button class="chip" onclick="useExample(2)"><span>🏠</span><span data-i18n="ex2"></span></button>
        <div style="height:16px"></div>
        <button class="btn primary" onclick="startSearch()" data-i18n="search_btn"></button>
        <div class="card soft" style="margin-top:16px"><div class="small muted" data-i18n="howto"></div></div>
      </section>

      <!-- ===== SCREEN 2: LÄUFT ===== -->
      <section id="running" class="screen">
        <div class="card" style="text-align:center;padding:22px">
          <div class="spinner"></div>
          <div style="font-weight:700;font-size:17px" id="runTitle"></div>
          <div class="muted small" data-i18n="run_sub"></div>
        </div>
        <div class="card log" id="runLog"></div>
      </section>

      <!-- ===== SCREEN 3: ERGEBNIS ===== -->
      <section id="results" class="screen">
        <p class="muted" style="margin:4px 0 2px" data-i18n="res_topic"></p>
        <p style="font-size:17px;font-weight:600;margin:0 0 12px" id="resQuery"></p>
        <div class="summary" id="resSummary"></div>
        <h2 data-i18n="res_h"></h2>
        <div class="card soft" style="padding:10px 12px"><div class="small muted" id="resNote"></div></div>
        <div id="resList"></div>
        <button class="btn ghost" onclick="openPreselect('all')" data-i18n="res_pre_btn"></button>
      </section>

      <!-- ===== SCREEN 4: PAPER ===== -->
      <section id="paper" class="screen">
        <div class="card">
          <div style="display:flex;gap:14px;align-items:flex-start">
            <div id="pScore"></div>
            <div style="flex:1;min-width:0">
              <p style="font-size:17px;font-weight:700;margin:0 0 6px" id="pTitle"></p>
              <p class="muted" style="margin:0 0 2px" id="pAuthors"></p>
              <p class="muted small" style="margin:0 0 8px" id="pJournal"></p>
              <div id="pBadges" style="display:flex;flex-wrap:wrap;gap:5px"></div>
            </div>
          </div>
          <p style="margin:12px 0 0"><a class="link" href="#" target="_blank" rel="noopener" id="pDoi"></a></p>
        </div>
        <div id="pRejected"></div>
        <div id="pRatedBlock">
          <h2 data-i18n="h_why"></h2>
          <div class="card" id="pCrit"></div>
          <h2 data-i18n="h_about"></h2>
          <div class="card"><p style="margin:0;font-size:15px" id="pAbstract"></p></div>
          <h2 data-i18n="h_refs"></h2>
          <div class="card" id="pRefs"></div>
          <h2 data-i18n="h_cite"></h2>
          <div class="card"><div class="citation" id="pCite"></div><div style="height:10px"></div><button class="btn ghost" onclick="copyCite()" data-i18n="copy_cite"></button></div>
        </div>
      </section>

      <!-- ===== SCREEN 5: VORAUSWAHL ===== -->
      <section id="preselect" class="screen">
        <p style="font-size:20px;font-weight:700;margin:8px 0 2px" data-i18n="pre_h"></p>
        <p class="muted" style="margin:0 0 12px" data-i18n="pre_p"></p>
        <div class="tabs">
          <button class="tab" data-f="all" onclick="setFilter('all')"></button>
          <button class="tab" data-f="pass" onclick="setFilter('pass')"></button>
          <button class="tab" data-f="rej" onclick="setFilter('rej')"></button>
        </div>
        <div id="preList"></div>
      </section>

    </div>
  </div>

  <!-- ===== RECHTE LEISTE ===== -->
  <aside id="side">
    <div class="side-title"><span data-i18n="side_process"></span><button class="close-side" onclick="closeSide()">✕</button></div>
    <div id="steps"></div>
    <div style="height:14px"></div>
    <div class="side-title"><span data-i18n="side_archive"></span><span class="small" style="font-weight:500;text-transform:none;letter-spacing:0" id="archCount"></span></div>
    <div id="archive"></div>
    <div style="height:10px"></div>
    <button class="btn ghost" style="padding:11px;font-size:14px" onclick="newProject()" data-i18n="new_project"></button>
    <div class="side-foot" data-i18n="proto_note"></div>
  </aside>
  <div id="scrim" onclick="closeSide()"></div>

  <!-- ===== SPRACHE (unten rechts) ===== -->
  <div id="langWrap">
    <div id="langMenu">
      <div class="lh" data-i18n="lang"></div>
      <button class="lopt" data-l="de" onclick="setLang('de')"><span class="flag" data-flag="de"></span>Deutsch<span class="chk"></span></button>
      <button class="lopt" data-l="en" onclick="setLang('en')"><span class="flag" data-flag="en"></span>English<span class="chk"></span></button>
      <button class="lopt" data-l="es" onclick="setLang('es')"><span class="flag" data-flag="es"></span>Español<span class="chk"></span></button>
    </div>
    <button id="langBtn" onclick="toggleLangMenu(event)"><span class="flag" id="langBtnFlag"></span><span id="langBtnText"></span><span style="color:var(--muted)">▴</span></button>
  </div>

  <div id="toast"></div>
</div>

<script>
/* =========================================================
   SPRACHEN
   ========================================================= */
const FLAGS = {
  de:'<svg viewBox="0 0 3 2"><rect width="3" height="2" fill="#000"/><rect y=".667" width="3" height="1.333" fill="#D00"/><rect y="1.333" width="3" height=".667" fill="#FFCE00"/></svg>',
  en:'<svg viewBox="0 0 60 30"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="2.5"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>',
  es:'<svg viewBox="0 0 3 2"><rect width="3" height="2" fill="#AA151B"/><rect y=".5" width="3" height="1" fill="#F1BF00"/></svg>'
};
const LANG_NAMES = {de:'Deutsch', en:'English', es:'Español'};

const STR = {
de:{
  menu:'Prozess', lang:'Sprache',
  start_h:'Wofür brauchst du Papers?',
  start_p:'Beschreib deine Situation oder dein Thema. Wir suchen passende wissenschaftliche Papers, sortieren erfundene oder unsaubere aus und bewerten den Rest von 1 bis 10 nach der Qualität ihrer Quellen.',
  start_ph:'z. B. Ich schreibe meine Bachelorarbeit über den Einfluss von Social Media auf die Konzentration von Studierenden und brauche aktuelle Studien.',
  examples_l:'Beispiele:',
  ex0:'Bachelorarbeit: Social Media und Konzentration von Studierenden', ex1:'Hausarbeit: Schlafmangel und Gedächtnis bei jungen Erwachsenen', ex2:'Seminar: Homeoffice und Produktivität',
  search_btn:'Papers suchen',
  howto:'<b style="color:var(--ink)">So läuft es ab:</b> 1 Thema verstehen · 2 Vorauswahl · 3 Prüfung (erfunden? zurückgezogen? unseriös?) · 4 Bewertung 1–10 · 5 Ergebnis. Den Stand siehst du rechts in der Leiste. Die Papers kommen live aus der offenen Datenbank OpenAlex, englische Suchbegriffe liefern die meisten Treffer.',
  run_sub:'Das dauert ein paar Sekunden.',
  res_topic:'Dein Thema', found:'gefunden', rejected:'aussortiert', rated:'bewertet',
  res_h:'Bewertete Papers (nach Bewertung sortiert)',
  res_note:'Die Zahl 1–10 sagt, wie gut die <b>Quellen</b> des Papers sind: peer-reviewed, aktuell, auffindbar, nicht zurückgezogen, wenig Eigenzitate. Nicht, ob das Ergebnis dir gefällt.',
  res_note_live:' Daten: OpenAlex, geprüft wurden bis zu 50 Quellen pro Paper.',

const OA = 'https://api.openalex.org/works';
const STOP = new Set(('ich schreibe meine mein meiner über den die der das und oder für von auf mit bei zum zur ein eine einen einer brauche aktuelle studien studie thema arbeit hausarbeit bachelorarbeit masterarbeit seminararbeit seminar paper papers einfluss effekt wie was welche welcher zu im in am an ist sind nicht ob dass '+
  'i am im writing my the a an and or for of on with at to about need recent studies study paper papers thesis bachelor bachelors master seminar term effect effects influence impact how what which is are does do not whether that this in '+
  'estoy escribiendo mi sobre el la los las de del y o para con en un una necesito recientes estudios estudio tema trabajo tfg tesis seminario influencia efecto cómo qué cuál es son no si que').split(' '));
function extractTerms(q){
  const words = q.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu,' ').split(/\s+/).filter(w=>w.length>2 && !STOP.has(w));
  const seen = new Set(), out = [];
  for(const w of words){ if(!seen.has(w)){ seen.add(w); out.push(w); } if(out.length>=7) break; }
  return out.length ? out : q.split(/\s+/).slice(0,5);
}
async function oaFetch(url){
  const r = await fetch(url, {headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function invertedToText(inv){
  if(!inv) return '';
  const arr = [];
  for(const w in inv) for(const pos of inv[w]) arr[pos] = w;
  return arr.filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
}
function apaName(n){
  const parts = (n||'').trim().split(/\s+/); if(parts.length<2) return n||'';
  const last = parts.pop(); return last+', '+parts.map(p=>p[0].toUpperCase()+'.').join(' ');
}
function formatAuthors(as){
  const names = (as||[]).map(a=>apaName(a.author && a.author.display_name)).filter(Boolean);
  if(!names.length) return '—';
  if(names.length===1) return names[0];
  if(names.length===2) return names[0]+', & '+names[1];
  if(names.length<=3) return names.slice(0,-1).join(', ')+', & '+names[names.length-1];
  return names.slice(0,3).join(', ')+', et al.';
}
const TYPE_MAP = {article:'ty_article', review:'ty_review', preprint:'ty_preprint', 'book-chapter':'ty_chapter', book:'ty_book', dissertation:'ty_dissertation'};
const STUDY_TYPES = new Set(['article','review','preprint','book-chapter','book','dissertation','report']);
let nextId = 1000;

function fromWork(w){
  const src = w.primary_location && w.primary_location.source;
  const b = w.biblio || {};
  let journal = src ? src.display_name : (w.type==='preprint' ? 'Preprint' : '—');
  if(b.volume) journal += ', '+b.volume; if(b.issue) journal += '('+b.issue+')';
  if(b.first_page) journal += ', '+b.first_page+(b.last_page?'–'+b.last_page:'');
  const doi = w.doi ? w.doi.replace(/^https?:\/\/doi\.org\//,'') : '';
  const authorIds = new Set((w.authorships||[]).map(a=>a.author && a.author.id).filter(Boolean));
  const p = {
    id: nextId++, real:true, oaId:w.id, status:'pass',
    title: w.title || w.display_name || '—', authors: formatAuthors(w.authorships), journal, year: w.publication_year || '',
    doi, type: TYPE_MAP[w.type] || 'ty_other', rawType:w.type, n:{key:'cited_n', n:w.cited_by_count||0},
    abstract: invertedToText(w.abstract_inverted_index), refIds:(w.referenced_works||[]).map(x=>x.replace('https://openalex.org/','')).slice(0,50),
    refCount: w.referenced_works_count||0, authorIds, scores:[5,5,5,5,5], refs:{total:w.referenced_works_count||0, peer:0, median:'–', bad:0, primary:'–', self:'–'}
  };
  // Prüfung (Schritt 3)
  if(w.is_retracted){ p.status='rej'; p.reason='r_retracted'; p.reasonLong={key:'rl_retracted'}; }
  else if(!STUDY_TYPES.has(w.type)){ p.status='rej'; p.reason='r_nostudy'; p.reasonLong={key:'rl_nostudy', vars:{ty:w.type}}; }
  else if(!p.refCount){ p.status='rej'; p.reason='r_norefs'; p.reasonLong={key:'rl_norefs'}; }
  else if(!doi && !src){ p.status='rej'; p.reason='r_notfound'; p.reasonLong={key:'rl_notfound'}; }
  return p;
}
const clamp = (v,a,b)=>Math.max(a, Math.min(b, Math.round(v)));
function scoreFromRefs(p, refs){
  if(!refs.length) return;
  const n = refs.length;
  const peerShare = refs.filter(r=>r.primary_location && r.primary_location.source && r.primary_location.source.type==='journal').length/n;
  const years = refs.map(r=>r.publication_year).filter(Boolean).sort((a,b)=>a-b);
  const median = years.length ? years[Math.floor(years.length/2)] : p.year;
  const age = (p.year||median) - median;
  const retracted = refs.filter(r=>r.is_retracted).length;
  const noDoi = refs.filter(r=>!r.doi).length/n;
  const primary = refs.filter(r=>r.type==='article'||r.type==='preprint').length/n;
  const self = refs.filter(r=>(r.authorships||[]).some(a=>a.author && p.authorIds.has(a.author.id))).length/n;
  p.scores = [
    clamp(peerShare*10,1,10),
    clamp(10 - Math.max(0, age-4),1,10),
    clamp(10 - retracted*3 - noDoi*4,1,10),
    clamp(primary*10,1,10),
    clamp(10 - self*20,1,10)
  ];
  p.refs = {total:p.refCount, peer:Math.round(peerShare*p.refCount), median, bad:retracted, primary:Math.round(primary*100)+' %', self:Math.round(self*100)+' %'};
}
async function enrichRefs(p){
  if(p.status!=='pass' || !p.refIds.length) return;
  try{
    const d = await oaFetch(OA+'?filter=openalex_id:'+p.refIds.join('|')+'&per-page=50&select=id,type,publication_year,is_retracted,doi,primary_location,authorships');
    scoreFromRefs(p, d.results||[]);
  }catch(e){ /* Netzfehler: neutrale Bewertung bleibt */ }
}
async function searchReal(q){
  const terms = extractTerms(q);
  const d = await oaFetch(OA+'?search='+encodeURIComponent(terms.join(' '))+'&per-page=14&select=id,doi,title,display_name,publication_year,type,is_retracted,cited_by_count,referenced_works_count,referenced_works,authorships,primary_location,biblio,abstract_inverted_index');
  return {terms, papers:(d.results||[]).map(fromWork)};
}

function found(p){ return p.papers.length; }
function passed(p){ return p.papers.filter(x=>x.status==='pass').sort((a,b)=>total(b)-total(a)); }
function rejected(p){ return p.papers.filter(x=>x.status==='rej'); }
function total(x){ return Math.round(x.scores.reduce((a,b)=>a+b,0)/x.scores.length); }
function avg(p){ const l=passed(p); return l.length ? l.reduce((a,x)=>a+total(x),0)/l.length : 0; }
function cls(n){ return n>=8?'s-high':n>=5?'s-mid':'s-low'; }
function badge(n,big){ return `<div class="score ${big?'big':''} ${cls(n)}">${n}<small>${t('of10')}</small></div>`; }
function label(n){ return t(n>=8?'lbl_high':n>=5?'lbl_mid':'lbl_low'); }
function nText(n){ return (n && typeof n==='object') ? t(n.key, {n:n.n}) : n; }
function reasonLong(x){ const r = x.reasonLong; return (r && r.key) ? t(r.key, r.vars) : tx(r); }
function titleOf(p){ return tx(p.title); }

function show(id, push=true){
  const act = document.querySelector('.screen.active');
  if(push && act && act.id!==id && act.id!=='running') history.push(act.id);
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('backBtn').style.display = (id==='start'||id==='running')?'none':'inline-block';
  document.getElementById('topTitle').textContent = current ? titleOf(current) : 'PaperScout';
  window.scrollTo(0,0);

}
function goBack(){
  const active = document.querySelector('.screen.active').id;
  // Verlauf zurück; wenn nichts mehr im Verlauf: Ergebnis → Start, sonst → Ergebnis
  while(history.length){ const prev = history.pop(); if(prev!==active){ show(prev, false); return; } }
  if(active==='results' || !current) show('start', false);
  else show('results', false);
}

const qEl = document.getElementById('query');
function useExample(i){ qEl.value = tx([PROJECT_SOCIAL, PROJECT_SLEEP, PROJECT_HOME][i].query); qEl.focus(); }
function newProject(){ if(running) return; current = null; history = []; runProgress = 0; qEl.value = ''; show('start', false); }
const wait = ms => new Promise(r=>setTimeout(r, ms));

function demoFor(q){
  let base = PROJECT_SOCIAL;
  if(/schlaf|gedächtnis|sleep|memory|sueño|memoria/i.test(q)) base = PROJECT_SLEEP;
  else if(/homeoffice|remote|produktiv|productiv|teletrabajo/i.test(q)) base = PROJECT_HOME;
  return base;
}

async function startSearch(){
  const q = qEl.value.trim();
  if(!q){ toast(t('t_topic')); qEl.focus(); return; }
  if(running) return;
  const terms = extractTerms(q);
  const proj = {id:'n'+Date.now(), date:'today', query:q, title:terms.slice(0,3).map(w=>w[0].toUpperCase()+w.slice(1)).join(' · ') || q.slice(0,30), terms, papers:[], live:true, offline:false};
  projects = [proj, ...projects];
  current = proj; history = []; runProgress = 0; running = true; shownLines = 0;
  document.getElementById('liveDot').classList.add('busy');
  show('running', false);

  const step = async (lines, progress, minMs)=>{ shownLines = lines; runProgress = progress; renderLog(proj, shownLines); renderSide(); await wait(minMs); };
  await step(1, 1, 500);          // Thema verstanden
  await step(2, 1, 300);          // Suche läuft
  try{
    const res = await searchReal(q);
    proj.papers = res.papers;
    if(!proj.papers.length){ proj.offline = false; proj.none = true; }
  }catch(e){
    const base = demoFor(q);
    proj.papers = base.papers.map(x=>Object.assign({}, x));
    proj.terms = tx(base.terms); proj.title = tx(base.title); proj.live = false; proj.offline = true;
  }
  if(proj.none){
    running = false; document.getElementById('liveDot').classList.remove('busy');
    toast(t('l_none')); projects = projects.filter(p=>p!==proj); current = null; show('start', false); return;
  }
  await step(3, 2, 600);          // gefunden
  await step(4, 2, 300);          // Prüfung läuft
  if(proj.live){
    const queue = proj.papers.filter(p=>p.status==='pass');
    let i = 0;
    await Promise.all([0,1,2,3].map(async ()=>{ while(i<queue.length){ const p = queue[i++]; await enrichRefs(p); } }));
  }else{ await wait(600); }
  await step(5, 3, 600);          // aussortiert
  await step(6, 4, 700);          // Bewertung
  await step(7, 5, 500);          // fertig
  running = false;
  document.getElementById('liveDot').classList.remove('busy');
  renderResults();
  show('results', false);
}

function logLines(p){
  const lines = [
    ['🧠', t('l0',{t:tx(p.terms).join(', ')})],
    ['🔎', t('l1')],
    ['📚', t('l2',{n:found(p)})],
    ['🕵️', t('l3')],
    ['🚫', t('l4',{n:rejected(p).length, r:[...new Set(rejected(p).map(r=>t(r.reason).toLowerCase()))].join(', ') || '–'})],
    ['⚖️', t('l5',{n:passed(p).length})],
    ['✅', t('l6',{b:passed(p).length?total(passed(p)[0]):0, a:fmt(avg(p))})]
  ];
  if(p.offline) lines.splice(2, 0, ['⚠️', t('l_offline')]);
  return lines;
}
function renderLog(p, shown){
  const lines = logLines(p);

}

  document.getElementById('pTitle').textContent = x.title;
  document.getElementById('pAuthors').textContent = x.authors;
  document.getElementById('pJournal').textContent = x.journal + ' · ' + x.year;
  document.getElementById('pBadges').innerHTML = rej
    ? `<span class="pill bad">${t(x.reason)}</span>`
    : `<span class="pill good">${label(total(x))}</span><span class="pill neutral">${t(x.type)}</span><span class="pill neutral">${nText(x.n)}</span>`;
  const a = document.getElementById('pDoi');
  a.textContent = x.doi ? t('open_orig',{doi:x.doi}) : t('no_doi');
  if(x.real && x.doi){ a.href = 'https://doi.org/'+x.doi; a.onclick = null; }
  else { a.href = '#'; a.onclick = ()=>{ toast(t('t_open')); return false; }; }
  document.getElementById('pRejected').innerHTML = rej ? `<div class="alert" style="margin-bottom:12px"><b>${t('why_out')}${t(x.reason)}</b>${esc(reasonLong(x))}<div style="margin-top:8px" class="small">${t('no_rating')}</div></div>` : '';
  document.getElementById('pRatedBlock').style.display = rej ? 'none' : 'block';
  if(!rej){
    document.getElementById('pCrit').innerHTML = [1,2,3,4,5].map((c,i)=>{
      const s = x.scores[i], col = s>=8?'var(--good)':s>=5?'var(--warn)':'var(--bad)';
      return `<div class="crit"><div class="top"><span>${t('c'+c)}</span><b>${s}/10</b></div><div class="bar"><i style="width:${s*10}%;background:${col}"></i></div><div class="exp">${t('c'+c+'e')}</div></div>`;
    }).join('') + `<div class="small muted" style="padding-top:10px">${t('total_line')} <b style="color:var(--ink)">${total(x)}/10</b></div>`;
    document.getElementById('pAbstract').textContent = tx(x.abstract) || t('no_abstract');
    const r = x.refs;
    document.getElementById('pRefs').innerHTML = `
      <div class="crit"><div class="top"><span>${t('ref_total')}</span><b>${r.total}</b></div></div>
      <div class="crit"><div class="top"><span>${t('ref_peer')}</span><b>${r.peer}</b></div></div>
      <div class="crit"><div class="top"><span>${t('ref_median')}</span><b>${r.median}</b></div></div>
      <div class="crit"><div class="top"><span>${t('ref_bad')}</span><b style="color:${r.bad?'var(--bad)':'var(--good)'}">${r.bad}</b></div></div>
      <div class="crit"><div class="top"><span>${t('ref_primary')}</span><b>${r.primary}</b></div></div>
      <div class="crit"><div class="top"><span>${t('ref_self')}</span><b>${r.self}</b></div></div>`;
    document.getElementById('pCite').textContent = `${x.authors} (${x.year}). ${x.title}. ${x.journal}.` + (x.doi ? ` https://doi.org/${x.doi}` : '');
  }
}
function copyCite(){ try{ navigator.clipboard && navigator.clipboard.writeText(document.getElementById('pCite').textContent);}catch(e){} toast(t('t_copied')); }

/* =========================================================
   VORAUSWAHL
   ========================================================= */
function openPreselect(f){ filter = f; renderPreselect(); show('preselect'); }
function setFilter(f){ filter = f; renderPreselect(); }
function renderPreselect(){
  const p = current; if(!p) return;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on', el.dataset.f===filter));
  document.querySelector('.tab[data-f=all]').textContent = t('tab_all')+' ('+found(p)+')';
  document.querySelector('.tab[data-f=pass]').textContent = t('tab_pass')+' ('+passed(p).length+')';
  document.querySelector('.tab[data-f=rej]').textContent = t('tab_rej')+' ('+rejected(p).length+')';
  const list = filter==='all' ? [...passed(p), ...rejected(p)] : filter==='pass' ? passed(p) : rejected(p);
  document.getElementById('preList').innerHTML = list.map(x=>{
    const rej = x.status==='rej';
    return `<div class="card row" onclick="openPaper(${x.id})">
      ${rej ? `<div class="score s-x">✕<small>${t('out_short')}</small></div>` : badge(total(x))}
      <div class="body">
        <p class="title">${esc(x.title)}</p>
        <p class="meta">${esc(x.authors)} · ${x.year} · ${esc(x.journal.split(',')[0])}</p>
        <p class="why">${rej ? `<span class="pill bad">${t(x.reason)}</span> <span class="muted small">${esc(reasonLong(x).split('. ')[0])}.</span>` : `<span class="pill good">${t('passed')}</span> <span class="muted small">${t('rated_with',{n:total(x)})}</span>`}</p>
      </div>
      <div class="arrow">›</div>
    </div>`;
  }).join('');
}

/* =========================================================
   RECHTE LEISTE
   ========================================================= */
function renderSide(){
  const p = current;
  const done = p ? (running ? runProgress : 5) : 0;
  const active = document.querySelector('.screen.active')?.id;
  document.getElementById('steps').innerHTML = STEP_DEFS.map((s,i)=>{
    const n = i+1, isDone = n<=done, isActive = running && n===done+1, clickable = isDone && s.go && !running;
    const cur = (active==='preselect' && ((n===2&&filter!=='rej')||(n===3&&filter==='rej'))) || (active==='results' && n===5);
    return `<div class="step ${isDone?'done':''} ${isActive?'active':''} ${clickable?'clickable':''} ${cur?'current':''}" ${clickable?`onclick="STEP_DEFS[${i}].go()"`:''}>
      <div class="vline"></div>
      <div class="n">${isDone?'✓':n}</div>
      <div><div class="t">${t(s.t)}</div><div class="d">${isActive?t('running_now'):s.d(isDone||isActive?p:null)}</div>${clickable?`<div class="act">${t(s.act)}</div>`:''}</div>
    </div>`;
  }).join('');
  document.getElementById('archCount').textContent = t('projects_n',{n:projects.length});
  document.getElementById('archive').innerHTML = projects.map(pr=>`
    <div class="proj ${current&&pr.id===current.id?'on':''}" onclick="loadProject('${pr.id}')">
      <div class="ico">📁</div>
      <div style="min-width:0"><div class="pt">${esc(titleOf(pr))}</div><div class="pd">${t('arch_meta',{d:t(pr.date), n:passed(pr).length, a:fmt(avg(pr))})}</div></div>
    </div>`).join('');
}
function loadProject(id){
  if(running) return;
  current = projects.find(p=>p.id===id);
  history = []; runProgress = 5;
  renderResults();
  show('results', false);
}

/* =========================================================
   HELFER
   ========================================================= */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}
applyStatic();
renderSide();
</script>
