<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PaperScout – Prototype</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f3f4f6; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
    --soft:#f8fafc; --soft2:#f3f4f6; --inv:#fff;
    --brand:#1d4ed8; --brand-soft:#dbeafe; --brand-line:#bfdbfe; --btn:#1d4ed8;
    --good:#16a34a; --good-soft:#dcfce7; --good-ink:#166534;
    --warn:#d97706; --warn-soft:#fef3c7; --warn-ink:#92400e;
    --bad:#dc2626; --bad-soft:#fee2e2; --bad-ink:#991b1b; --bad-line:#fecaca;
    --neutral-ink:#374151; --toast-bg:#111827; --toast-ink:#fff;
    --side-w:320px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0f172a; --card:#1e293b; --ink:#e5e7eb; --muted:#9ca3af; --line:#334155;
      --soft:#243044; --soft2:#334155; --inv:#0f172a;
      --brand:#60a5fa; --brand-soft:#1e3a8a; --brand-line:#1d4ed8; --btn:#2563eb;
      --good:#22c55e; --good-soft:#14532d; --good-ink:#bbf7d0;
      --warn:#f59e0b; --warn-soft:#78350f; --warn-ink:#fde68a;
      --bad:#ef4444; --bad-soft:#7f1d1d; --bad-ink:#fecaca; --bad-line:#991b1b;
      --neutral-ink:#d1d5db; --toast-bg:#e5e7eb; --toast-ink:#111827;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0f172a; --card:#1e293b; --ink:#e5e7eb; --muted:#9ca3af; --line:#334155;
    --soft:#243044; --soft2:#334155; --inv:#0f172a;
    --brand:#60a5fa; --brand-soft:#1e3a8a; --brand-line:#1d4ed8; --btn:#2563eb;
    --good:#22c55e; --good-soft:#14532d; --good-ink:#bbf7d0;
    --warn:#f59e0b; --warn-soft:#78350f; --warn-ink:#fde68a;
    --bad:#ef4444; --bad-soft:#7f1d1d; --bad-ink:#fecaca; --bad-line:#991b1b;
    --neutral-ink:#d1d5db; --toast-bg:#e5e7eb; --toast-ink:#111827;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:16px;line-height:1.45}
  .app{display:flex;min-height:100dvh}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
  .topbar .mark{width:32px;height:32px;border-radius:9px;background:var(--btn);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none}
  .topbar h1{font-size:16px;margin:0;flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .back{border:1px solid var(--line);background:var(--card);width:34px;height:34px;border-radius:9px;font-size:18px;cursor:pointer;color:var(--ink);flex:none}
  .menu-btn{border:1px solid var(--line);background:var(--card);height:34px;padding:0 10px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:600;display:none;align-items:center;gap:6px;flex:none}
  .menu-btn .dotlive{width:8px;height:8px;border-radius:50%;background:var(--good)}
  .menu-btn .dotlive.busy{background:var(--warn);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .content{padding:16px;max-width:760px;width:100%;margin:0 auto;padding-bottom:80px}
  .screen{display:none}.screen.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;color:var(--ink)}
  .card.soft{background:var(--soft)}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
  .btn.primary{background:var(--btn);color:#fff}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .btn + .btn{margin-top:10px}
  .muted{color:var(--muted);font-size:14px}.small{font-size:13px}
  h2{font-size:13px;margin:18px 0 8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;resize:none;outline:none;background:var(--card);color:var(--ink)}
  textarea::placeholder{color:var(--muted)}
  textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .modes{display:flex;gap:4px;background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 0 6px}
  .mode{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 10px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
  .mode.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  textarea.tall{min-height:190px;font-size:15px}
  .src-line{font-size:13px;color:var(--muted);margin:6px 0 0;word-break:break-word}
  .terms{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px}
  .term{background:var(--brand-soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
  .linkbtn{border:0;background:none;color:var(--brand);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:2px 4px}
  .terms-edit{display:none;gap:8px;margin:0 0 12px}
  .terms-edit.open{display:flex}
  .terms-edit input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;background:var(--card);color:var(--ink)}
  .terms-edit .btn{width:auto;padding:9px 14px;font-size:14px}
  .fit{font-size:13px;color:var(--muted);margin:6px 0 0}
  .fit b{color:var(--ink);font-weight:600}
  .fit.warn{color:var(--warn-ink)}
  .term.c{background:var(--warn-soft);color:var(--warn-ink)}
  .sortbar{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;color:var(--muted)}
  .sortbar select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;background:var(--card);color:var(--ink)}
  .jline{font-size:13px;color:var(--muted);margin:0 0 6px}
  .ranks{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:0 0 6px}
  .rk{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;color:var(--ink);background:var(--card)}
  .rk.none{color:var(--muted);font-weight:500;border-style:dashed}
  .rk-l{font-size:12px;color:var(--muted)}
  .score-why{font-size:13px;color:var(--muted);margin:4px 0 0}
  details.crit-d{margin:6px 0 0;font-size:13px}
  details.crit-d summary{cursor:pointer;color:var(--brand);font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:6px}
  details.crit-d summary::-webkit-details-marker{display:none}
  details.crit-d summary .i{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;font-weight:700;font-style:normal}
  .cd-grid{display:grid;grid-template-columns:auto 60px 34px;gap:6px 10px;align-items:center;margin:8px 0 2px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
  .cd-grid .nm{font-weight:600;color:var(--ink)}
  .cd-grid .ex{grid-column:1 / -1;color:var(--muted);margin:-4px 0 4px}
  .cd-bar{height:6px;border-radius:999px;background:var(--soft2);overflow:hidden}
  .cd-bar i{display:block;height:100%}
  .cd-grid .v{text-align:right;font-weight:700;color:var(--ink)}
  .wbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
  .wbtn.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
  .watchbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
  .watchbar .btn{width:auto;padding:9px 14px;font-size:14px}
  .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .btnrow .btn{width:auto;flex:1 1 180px;padding:11px 12px;font-size:14px;margin:0}
  ul.sum{margin:6px 0 4px;padding-left:18px;font-size:14px;line-height:1.45}
  ul.sum li{margin:0 0 3px}
  ul.sum li b{font-weight:600}
  .sum-note{font-size:12px;color:var(--muted);margin:2px 0 0}
  .sum.pending ul.sum{opacity:.75}
  details.abs-d{margin-top:10px;font-size:14px}
  details.abs-d summary{cursor:pointer;color:var(--brand);font-weight:600}
  .hdr{font-size:17px;font-weight:700;margin:2px 0 2px}
  .hdr .ok{color:var(--good)} .hdr .out{color:var(--bad)}
  .hdr-hint{font-size:13px;color:var(--muted);margin:0 0 4px}
  details.outd{margin:14px 0}
  details.outd > summary{cursor:pointer;font-weight:600;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);list-style:none}
  details.outd > summary::-webkit-details-marker{display:none}
  details.outd > summary::before{content:'▸ ';color:var(--muted)}
  details.outd[open] > summary::before{content:'▾ '}
  .outrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .outrow:last-child{border-bottom:0}
  .outrow .ot{font-size:14px;font-weight:600;margin:0 0 3px}
  .outlist{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:var(--card);margin-top:-6px;padding-top:6px}
  .chip{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;cursor:pointer;color:var(--ink);display:flex;gap:8px;width:100%;margin-top:8px;font-family:inherit}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.good{background:var(--good-soft);color:var(--good-ink)}.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
  .pill.bad{background:var(--bad-soft);color:var(--bad-ink)}.pill.neutral{background:var(--soft2);color:var(--neutral-ink)}
  .score{width:44px;height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:18px;line-height:1;flex:none;color:#fff}
  .score small{font-size:9px;font-weight:600;opacity:.9;margin-top:2px}
  .s-high{background:#16a34a}.s-mid{background:#d97706}.s-low{background:#dc2626}.s-x{background:#9ca3af}
  .score.big{width:72px;height:72px;font-size:30px;border-radius:18px}
  .score.big small{font-size:11px}
  .row{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  .row .body{flex:1;min-width:0}
  .row .title{font-weight:600;font-size:15px;margin:0 0 2px}
  .row .meta{font-size:13px;color:var(--muted);margin:0 0 6px}
  .row .why{font-size:13px;margin:0}
  .row .arrow{color:var(--muted);flex:none;padding-top:10px}
  .tabs{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;color:var(--ink)}
  .tab.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
  .crit{padding:10px 0;border-bottom:1px solid var(--line)}
  .crit:last-child{border-bottom:0}
  .crit .top{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:10px}
  .crit .top b{font-weight:700;flex:none}
  .crit .bar{height:8px;border-radius:999px;background:var(--soft2);margin:6px 0 4px;overflow:hidden}
  .crit .bar i{display:block;height:100%;border-radius:999px}
  .crit .exp{font-size:13px;color:var(--muted)}
  .alert{background:var(--bad-soft);border:1px solid var(--bad-line);border-radius:12px;padding:12px;font-size:15px;color:var(--ink)}
  .alert b{display:block;margin-bottom:4px}
  .link{color:var(--brand);text-decoration:none;font-weight:500;word-break:break-all}
  .citation{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px;line-height:1.5;color:var(--ink)}
  .log{font-size:15px}
  .log .ln{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateY(4px);transition:all .3s}
  .log .ln.on{opacity:1;transform:none}
  .log .ln:last-child{border-bottom:0}
  .log .ico{flex:none;width:22px;text-align:center}
  .spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .summary .st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .summary .st .n{font-size:22px;font-weight:800}
  .summary .st .l{font-size:12px;color:var(--muted)}
  aside{width:var(--side-w);flex:none;background:var(--card);border-left:1px solid var(--line);position:sticky;top:0;height:100dvh;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
  .side-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 8px;display:flex;justify-content:space-between;align-items:center}
  .close-side{display:none;border:0;background:var(--soft2);width:30px;height:30px;border-radius:8px;font-size:16px;cursor:pointer;color:var(--ink)}
  .side-foot{margin-top:auto;padding-top:14px;font-size:13px;color:var(--muted)}
  .step{display:flex;gap:10px;padding:9px 8px;border-radius:10px;position:relative}
  .step .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex:none;background:var(--card)}
  .step .t{font-size:14px;font-weight:600;color:var(--muted)}
  .step .d{font-size:12px;color:var(--muted);margin-top:1px}
  .step .act{font-size:12px;color:var(--brand);font-weight:600;margin-top:3px;display:none}
  .step.done .n{background:var(--good);border-color:var(--good);color:#fff}
  .step.done .t{color:var(--ink)}
  .step.active .n{border-color:var(--brand);color:var(--brand);animation:pulse 1.2s infinite}
  .step.active .t{color:var(--brand)}
  .step.clickable{cursor:pointer}
  .step.clickable:hover{background:var(--soft)}
  .step.clickable .act{display:block}
  .step.current{background:var(--brand-soft)}
  .vline{position:absolute;left:20px;top:36px;width:2px;height:calc(100% - 28px);background:var(--line)}
  .step:last-child .vline{display:none}
  .proj{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .proj:hover{background:var(--soft)}
  .proj.on{background:var(--brand-soft);border-color:var(--brand-line)}
  .proj .ico{width:30px;height:30px;border-radius:8px;background:var(--soft2);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
  .proj .pt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .proj .pd{font-size:12px;color:var(--muted)}
  #scrim{display:none;position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:25}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:var(--toast-ink);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:60;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .flag{width:22px;height:15px;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
  .flag svg{display:block;width:100%;height:100%}
  .lang-slot{display:flex;flex:none;align-items:center}
  .side-head{margin:-4px 0 8px}
  #langWrap{position:relative;z-index:70;text-transform:none;letter-spacing:normal}
  #langBtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;height:34px;padding:0 9px 0 11px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink)}
  #langBtn:hover{background:var(--soft)}
  #langBtn .flag{width:24px;height:16px}
  #langBtn .chev{width:17px;height:17px;flex:none;color:var(--ink);transition:transform .2s}
  #langWrap.open #langBtn .chev{transform:rotate(180deg)}
  #langMenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:180px;box-shadow:0 10px 30px rgba(0,0,0,.16);display:none}
  #langWrap.open #langMenu{display:block}
  .btn.ext{background:var(--card);border:1.5px solid var(--brand);color:var(--brand);margin-bottom:6px}
  .ext-note{margin:0 2px 14px}
  #langMenu .lh{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 10px 4px}
  .lopt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);text-align:left}
  .lopt:hover{background:var(--soft2)}
  .lopt.on{background:var(--brand-soft);font-weight:600}
  .lopt .chk{margin-left:auto;color:var(--brand);font-weight:700}
  @media (max-width:899px){
    aside{position:fixed;right:0;top:0;width:min(86vw,340px);transform:translateX(100%);transition:transform .25s;z-index:30;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
    aside.open{transform:none}
    .menu-btn{display:inline-flex}
    .close-side{display:block}
    #scrim.show{display:block}
    #langBtnText{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div class="topbar">
      <button class="back" id="backBtn" onclick="goBack()" style="display:none">‹</button>
      <div class="mark" onclick="newProject()" style="cursor:pointer">P</div>
      <h1 id="topTitle">PaperScout</h1>
      <div id="langSlotTop" class="lang-slot"></div>
      <button class="menu-btn" onclick="openSide()"><span class="dotlive" id="liveDot"></span> <span data-i18n="menu"></span></button>
    </div>

    <div class="content">

      <!-- ===== SCREEN 1: THEMA ===== -->
      <section id="start" class="screen active">
        <div class="modes">
          <button class="mode on" data-mode="search" onclick="setMode('search')" data-i18n="mode_search"></button>
          <button class="mode" data-mode="check" onclick="setMode('check')" data-i18n="mode_check"></button>
        </div>
        <div id="searchPane">
        <p style="font-size:22px;font-weight:700;margin:14px 0 4px" data-i18n="start_h"></p>
        <p class="muted" style="margin:0 0 14px" data-i18n="start_p"></p>
        <textarea id="query" data-i18n-ph="start_ph"></textarea>
        <div class="muted small" style="margin-top:10px" data-i18n="examples_l"></div>
        <button class="chip" onclick="useExample(0)"><span>📱</span><span data-i18n="ex0"></span></button>
        <button class="chip" onclick="useExample(1)"><span>💤</span><span data-i18n="ex1"></span></button>
        <button class="chip" onclick="useExample(2)"><span>🏠</span><span data-i18n="ex2"></span></button>
        <div style="height:16px"></div>
        <button class="btn primary" onclick="startSearch()" data-i18n="search_btn"></button>
        <div class="card soft" style="margin-top:16px"><div class="small muted" data-i18n="howto"></div></div>
        </div>
        <div id="checkPane" style="display:none">
          <p style="font-size:22px;font-weight:700;margin:14px 0 4px" data-i18n="check_h"></p>
          <p class="muted" style="margin:0 0 14px" data-i18n="check_p"></p>
          <textarea id="checkInput" class="tall" data-i18n-ph="check_ph"></textarea>
          <button class="chip" onclick="useCheckExample()"><span data-i18n="check_ex"></span></button>
          <div style="height:16px"></div>
          <button class="btn primary" onclick="startCheck()" data-i18n="check_btn"></button>
          <div class="card soft" style="margin-top:16px"><div class="small muted" data-i18n="check_howto"></div></div>
        </div>
      </section>

      <!-- ===== SCREEN 2: LÄUFT ===== -->
      <section id="running" class="screen">

function extractKeywords(text){

  const out = []; let run = [];

async function translate(text, from, to){
  if(!text || from===to) return text;

    const r = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(String(text).slice(0,480))+'&langpair='+from+'|'+to);

    }catch(e){}

}
async function enrichRefs(p){

  }catch(e){ /* Netzfehler: neutrale Bewertung bleibt */ }

const WORK_FIELDS = 'id,doi,title,display_name,publication_year,type,is_retracted,cited_by_count,referenced_works_count,referenced_works,authorships,primary_location,biblio,abstract_inverted_index,language';
// Vorauswahl aus 50 Kandidaten: die passendsten mit Quellenverzeichnis zuerst (max. 10),
// dann bis 14 mit den nächstbesten auffüllen, Reihenfolge nach Passung bleibt erhalten.
function pickCandidates(works){
  const withRefs = works.filter(w=>w.referenced_works_count>0).slice(0,10);
  const rest = works.filter(w=>!withRefs.includes(w)).slice(0, 14-withRefs.length);
  const chosen = new Set([...withRefs, ...rest]);
  return works.filter(w=>chosen.has(w));
}
/* Boolesche Suche: erkennt AND/OR/NOT (auch UND/ODER/NICHT, im Spanischen Y/O/NO),
   && || & |, "Phrasen", (Klammern), -Wort / !Wort zum Ausschließen, +Wort, * und ? als Platzhalter.
   Gibt null zurück, wenn der Text keine Such-Syntax enthält (dann: Suche nach Bedeutung). */
const BOOL_OPS = {AND:'AND', OR:'OR', NOT:'NOT', UND:'AND', ODER:'OR', NICHT:'NOT'};
const BOOL_OPS_ES = {Y:'AND', O:'OR', NO:'NOT'};
function parseBoolean(q){
  let isBool = false;
  let s = q.replace(/[„“”«»]/g, '"');
  s = s.replace(/(^|[\s(])[-!](?=["(\p{L}\p{N}])/gu, (m, a)=>{ isBool = true; return a+'NOT '; });
  s = s.replace(/(^|[\s(])\+(?=["(\p{L}\p{N}])/gu, (m, a)=>{ isBool = true; return a; });
  const tokens = s.match(/"[^"]*"|\(|\)|&&|\|\||&|\||[^\s()"&|]+/g) || [];
  const out = [];
  for(const tk of tokens){
    if(tk[0]==='"'){ if(tk.replace(/"/g,'').trim()){ out.push('"'+tk.replace(/"/g,'').trim()+'"'); isBool = true; } continue; }
    if(tk==='(' || tk===')'){ out.push(tk); isBool = true; continue; }
    if(tk==='&&' || tk==='&'){ out.push('AND'); isBool = true; continue; }
    if(tk==='||' || tk==='|'){ out.push('OR'); isBool = true; continue; }
    const op = BOOL_OPS[tk] || (L==='es' ? BOOL_OPS_ES[tk] : null);
    if(op){ out.push(op); isBool = true; continue; }
    const w = tk.replace(/[.,;:!]+$/,'').replace(/\?$/,'');
    if(!w) continue;
    if(/[\p{L}\p{N}]\*|\*[\p{L}\p{N}]|[\p{L}\p{N}]\?[\p{L}\p{N}]/u.test(w)) isBool = true;
    out.push(w);
  }
  if(!isBool) return null;
  const BIN = new Set(['AND','OR']), clean = [];
  for(const tk of out){
    const prev = clean[clean.length-1];
    if(BIN.has(tk) && (!prev || BIN.has(prev) || prev==='NOT' || prev==='(')) continue;
    if(tk==='NOT' && prev==='NOT') continue;
    if(tk===')' && (BIN.has(prev) || prev==='NOT')) clean.pop();
    clean.push(tk);
  }
  while(clean.length && (BIN.has(clean[clean.length-1]) || clean[clean.length-1]==='NOT' || clean[clean.length-1]==='(')) clean.pop();
  let depth = 0; const bal = [];
  for(const tk of clean){ if(tk==='('){ depth++; bal.push(tk); } else if(tk===')'){ if(depth>0){ depth--; bal.push(tk); } } else bal.push(tk); }
  while(depth-- > 0) bal.push(')');
  const expr = bal.join(' ').replace(/\( /g,'(').replace(/ \)/g,')').trim();
  if(!expr.replace(/\b(AND|OR|NOT)\b|[()]/g,'').trim()) return null;
  return {expr, wildcard: /[*?]/.test(expr.replace(/"[^"]*"/g,''))};
}
function langList(codes){
  const names = codes.map(c=>t('ln_'+c));
  return names.length<2 ? (names[0]||'') : names.slice(0,-1).join(', ')+' '+t('and_word')+' '+names[names.length-1];
}
// Sucht Papers in den angegebenen Sprachen. excludeIds: bereits gefundene Papers (für die erweiterte Suche).
async function searchReal(q, langs, excludeIds, boolExpr, info){
  const terms = (info && (info.custom || (info.enTerms.length ? info.enTerms : info.origTerms))) || extractTerms(q);
  const cons = info ? info.cons : (boolExpr ? detectConstraints(q) : null);
  const filt = '&filter=has_abstract:true,language:'+langs.join('|')+yearFilter(cons)+'&per-page=50&select='+WORK_FIELDS;
  const keep = w => !excludeIds || !excludeIds.has(w.id);
  const tryFetch = async url => {
    for(let a=0; a<2; a++){
      try{ return ((await oaFetch(url)).results || []).filter(keep); }
      catch(e){ if(a===0) await new Promise(r=>setTimeout(r,1500)); }
    }
    return null;
  };
  let works = null;
  // 1) Mit Operatoren (AND, OR, NOT, "…", *): Stichwortsuche, bei Platzhaltern die exakte Suche
  if(boolExpr) works = await tryFetch(OA+'?'+(boolExpr.wildcard?'search.exact':'search')+'='+encodeURIComponent(boolExpr.expr)+filt);
  // 2) Sonst: Suche nach der Bedeutung des ganzen Satzes, ergänzt um die (englischen) Kernbegriffe
  if(works===null && !boolExpr){
    const sem = (info && info.custom) ? [] : await tryFetch(OA+'?search.semantic='+encodeURIComponent(q.slice(0,500))+filt);
    const kw = terms.length ? await tryFetch(OA+'?search='+encodeURIComponent(terms.join(' '))+filt) : [];
    if(sem!==null || kw!==null){
      const seen = new Set(); works = [];
      for(const w of [...(sem||[]), ...(kw||[])]) if(!seen.has(w.id)){ seen.add(w.id); works.push(w); }
    }
  }
  // 3) Keine Treffer: automatisch mit weniger Begriffen erneut suchen
  if(works!==null && !works.length && !boolExpr && terms.length > 1){
    for(const n of [Math.min(3, terms.length-1), 2, 1]){
      if(n >= terms.length || n < 1) continue;
      const fewer = terms.slice(0, n);
      const r = await tryFetch(OA+'?search='+encodeURIComponent(fewer.join(' '))+filt);
      if(r && r.length){ works = r; if(info) info.relaxed = fewer; break; }
    }
  }
  if(works===null) throw new Error('offline');
  // Relevanz zum Thema berechnen und danach sortieren (getrennt vom Qualitäts-Score)
  const relInfo = info || {origTerms: boolExpr ? boolExpr.expr.replace(/\b(AND|OR|NOT)\b|[()"*?]/g,' ').split(/\s+/).filter(x=>x.length>2) : terms, enTerms:[]};
  works.forEach(w=>{ w._rel = relevanceOf(w, relInfo, cons); });
  works.sort((a,b)=>b._rel.score - a._rel.score);
  return {terms, papers:pickCandidates(works).map(w=>{ const pp = fromWork(w); pp.rel = w._rel; return pp; })};
}

// Startet eine Suche; customTerms: vom Nutzer angepasste Suchbegriffe (Punkt 2)
async function runSearch(q, customTerms){
  if(running) return;
  const terms = extractTerms(q);
  const boolExpr = customTerms ? null : parseBoolean(q);
  const proj = {id:'n'+Date.now(), date:'today', query:q, title:terms.slice(0,3).map(w=>w[0].toUpperCase()+w.slice(1)).join(' · ') || q.slice(0,30), terms, papers:[], live:true, offline:false, lang:L, boolExpr};
  projects = [proj, ...projects];
  current = proj; history = []; runProgress = 0; running = true; shownLines = 0;
  document.getElementById('liveDot').classList.add('busy');
  show('running', false);

  const step = async (lines, progress, minMs)=>{ shownLines = lines; runProgress = progress; renderLog(proj, shownLines); renderSide(); await wait(minMs); };
  if(!boolExpr){
    proj.info = customTerms ? {lang:detectLang(q), origTerms:customTerms, enTerms:customTerms, custom:customTerms} : await understandQuery(q);
    proj.info.cons = detectConstraints(q, proj.info.en);
  }
  proj.searchLangs = [...new Set(['en', L, (proj.info && proj.info.lang) || L])].filter(l=>['en','de','es'].includes(l));
  await step(1, 1, 500);          // Thema verstanden
  await step(2, 1, 300);          // Suche läuft
  try{
    const res = await searchReal(q, proj.searchLangs, null, boolExpr, proj.info);
    proj.papers = res.papers;
  }catch(e){
    const base = demoFor(q);
    proj.papers = base.papers.map(x=>Object.assign({}, x));
    proj.terms = tx(base.terms); proj.title = tx(base.title); proj.live = false; proj.offline = true;
  }
  await step(3, 2, 600);          // gefunden
  await step(4, 2, 300);          // Prüfung läuft
  if(proj.live){
    await checkDois(proj.papers);
    await enrichSources(proj.papers);
    const queue = proj.papers.filter(p=>p.status==='pass');
    let i = 0;
    await Promise.all([0,1,2,3].map(async ()=>{ while(i<queue.length){ const p = queue[i++]; await enrichRefs(p); } }));
  }else{ await wait(600); }
  await step(5, 3, 600);          // aussortiert
  await step(6, 4, 700);          // Bewertung
  await step(7, 5, 500);          // fertig
  running = false;
  document.getElementById('liveDot').classList.remove('busy');
  proj.created = proj.created || Date.now(); proj.watch = proj.watch || [];
  saveProjects();
  renderResults();
  show('results', false);
}

// Erweiterte Suche: sucht zusätzlich in den anderen Sprachen und hängt neue Papers an die bisherigen an
async function extendSearch(){
  const p = current;
  if(running || !p || !p.live || p.extended) return;
  p.extLangs = ['en','de','es'].filter(l=>!(p.searchLangs||[p.lang||'en']).includes(l));
  if(!p.extLangs.length) return;
  p.addedCount = 0; p.extending = true;
  running = true; runProgress = 0; shownLines = 0; history = [];
  document.getElementById('liveDot').classList.add('busy');
  show('running', false);
  const step = async (lines, progress, minMs)=>{ shownLines = lines; runProgress = progress; renderLog(p, shownLines); renderSide(); await wait(minMs); };
  await step(1, 1, 500);
  await step(2, 1, 300);
  let added;
  try{
    added = (await searchReal(tx(p.query), p.extLangs, new Set(p.papers.map(x=>x.oaId)), p.boolExpr, p.info)).papers;
  }catch(e){
    running = false; p.extending = false;
    document.getElementById('liveDot').classList.remove('busy');
    toast(t('t_ext_fail')); renderResults(); show('results', false); return;
  }
  added.forEach(x=>{ x.ext = true; });
  p.papers = p.papers.concat(added); p.addedCount = added.length;
  await step(3, 2, 600);
  await step(4, 2, 300);
  await checkDois(added);
  await enrichSources(added);
  const queue = added.filter(x=>x.status==='pass');
  let i = 0;
  await Promise.all([0,1,2,3].map(async ()=>{ while(i<queue.length){ const x = queue[i++]; await enrichRefs(x); } }));
  await step(5, 3, 600);
  await step(6, 4, 700);
  await step(7, 5, 500);
  running = false; p.extending = false; p.extended = true;
  document.getElementById('liveDot').classList.remove('busy');
  saveProjects();
  renderResults();
  show('results', false);
}

const DOI_RE = /10\.\d{4,9}\/[^\s"<>]+/i;
function normText(s){ return String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim(); }
// Anteil der Titelwörter, die in der eingegebenen Zeile vorkommen
function titleMatch(line, title){
  const l = ' '+normText(line)+' ';
  const words = normText(title).split(' ').filter(w=>w.length>2);
  if(!words.length) return 0;
  const hit = words.filter(w=>l.includes(' '+w+' ')).length;
  return hit < Math.min(3, words.length) ? 0 : hit/words.length;
}
function cleanCitation(line){
  return line.replace(/https?:\/\/\S+/g,' ').replace(DOI_RE,' ').replace(/\(\d{4}[a-z]?\)/g,' ')
    .replace(/\b\d+(\(\d+\))?[,:]?\s*\d*\s*[-–]\s*\d+\b/g,' ').replace(/[^\p{L}\p{N}\s'-]/gu,' ').replace(/\s+/g,' ').trim().slice(0,300);
}
async function resolveLine(line){
  const m = line.match(DOI_RE);
  if(m){
    const doi = m[0].replace(/[.,;)\]]+$/,'');
    try{ const w = await oaFetch(OA+'/doi:'+doi+'?select='+WORK_FIELDS); if(w && w.id) return {w, via:'doi'}; }catch(e){}
  }
  const pickBest = results => {
    let best = null, bestS = 0;
    for(const w of (results||[])){ const sc = titleMatch(line, w.title||w.display_name||''); if(sc > bestS){ best = w; bestS = sc; } }
    return bestS >= 0.75 ? best : null;
  };
  // 1) Titel aus der Literaturangabe herauslösen und gezielt im Titelfeld suchen
  const title = extractCitedTitle(line);
  const tw = normText(title).split(' ').filter(Boolean);
  if(tw.length >= 2){
    const d = await oaFetch(OA+'?filter=title.search:'+encodeURIComponent(tw.slice(0,25).join(' '))+'&per-page=5&select='+WORK_FIELDS);
    const w = pickBest(d.results); if(w) return {w, via:'title'};
  }
  // 2) Rückfall: Volltextsuche mit der bereinigten Zeile
  const c = cleanCitation(line);
  if(c.split(' ').length < 3) return {w:null};
  const d2 = await oaFetch(OA+'?search='+encodeURIComponent(c)+'&per-page=5&select='+WORK_FIELDS);
  const w2 = pickBest(d2.results);
  return w2 ? {w:w2, via:'title'} : {w:null};
}
// Titel aus einer Literaturangabe: in Anführungszeichen (MLA) oder der Satz nach der Jahreszahl (APA, Harvard)
function extractCitedTitle(line){
  const q = line.match(/[“"«„]([^”"»“]{8,})[”"»“]/);
  if(q) return q[1];
  const m = line.match(/\b(?:19|20)\d{2}[a-z]?\)?[.,:]?\s+(.+?[^A-Z\s][.?!])(?:\s|$)/);
  if(m && m[1].split(' ').length >= 3) return m[1];
  return line.replace(DOI_RE,'').replace(/https?:\/\/\S+/g,'');
}
function checkFound(p){ return p.lines ? p.lines.filter(l=>l.pid).length : 0; }
async function startCheck(){
  const lines = chkEl.value.split(/\n+/).map(s=>s.trim()).filter(s=>s.length>3).slice(0,40);
  if(!lines.length){ toast(t('t_check_empty')); chkEl.focus(); return; }
  if(running) return;
  const proj = {id:'c'+Date.now(), date:'today', mode:'check', query:lines.join('\n'), title:{key:'check_title', vars:{n:lines.length}},
    terms:[], papers:[], live:true, offline:false, lang:L, lines:lines.map(l=>({line:l, pid:null}))};
  projects = [proj, ...projects];
  current = proj; history = []; runProgress = 0; running = true; shownLines = 0;
  document.getElementById('liveDot').classList.add('busy');
  show('running', false);
  const step = async (n, progress, minMs)=>{ shownLines = n; runProgress = progress; renderLog(proj, shownLines); renderSide(); await wait(minMs); };
  await step(1, 1, 400);
  await step(2, 1, 200);
  let k = 0, errors = 0;
  await Promise.all([0,1,2].map(async ()=>{
    while(k < lines.length){
      const i = k++;
      try{
        const r = await resolveLine(lines[i]);
        if(r.w){ const pp = fromWork(r.w); pp.via = r.via; pp.inputLine = lines[i]; proj.papers.push(pp); proj.lines[i].pid = pp.id; }
      }catch(e){ errors++; }
    }
  }));
  if(errors === lines.length){ running = false; document.getElementById('liveDot').classList.remove('busy'); toast(t('l_offline')); projects = projects.filter(x=>x!==proj); current = null; show('start', false); return; }
  await step(3, 2, 500);
  await step(4, 2, 300);
  await checkDois(proj.papers);
  await enrichSources(proj.papers);
  const queue = proj.papers.filter(x=>x.status==='pass');
  let j = 0;
  await Promise.all([0,1,2,3].map(async ()=>{ while(j<queue.length){ const x = queue[j++]; await enrichRefs(x); } }));
  await step(5, 3, 500);
  await step(6, 4, 600);
  await step(7, 5, 400);
  running = false;
  document.getElementById('liveDot').classList.remove('busy');
  proj.created = Date.now(); proj.watch = [];
  saveProjects();
  renderResults();
  show('results', false);
}

const STORE_KEY = 'ps3_projects';
function dateLabel(pr){
  if(!pr.created) return t(pr.date);
  const d = new Date(pr.created), now = new Date();
  return d.toDateString()===now.toDateString() ? t('today') : d.toLocaleDateString(L, {day:'numeric', month:'short', year:'numeric'});
}
function serializePaper(x){
  const o = Object.assign({}, x);
  delete o.authorIds; delete o.refIds;
  if(typeof o.abstract==='string' && o.abstract.length > 3000) o.abstract = o.abstract.slice(0,3000)+' …';
  if(o.rel) o.rel = Object.assign({}, o.rel, {missing:(o.rel.missing||[]).map(c=>c.label.en)});
  return o;
}
function serializeProject(pr){
  const o = Object.assign({}, pr, {papers: pr.papers.map(serializePaper)});
  delete o.extending;
  if(o.info){ o.info = Object.assign({}, o.info); if(o.info.cons) o.info.cons = {items:o.info.cons.items.map(c=>c.label.en), years:o.info.cons.years}; }
  return o;
}
const consByLabel = l => CONSTRAINTS.find(c=>c.label.en===l);
function reviveProject(o){
  if(o.info && o.info.cons) o.info.cons = {items:(o.info.cons.items||[]).map(consByLabel).filter(Boolean), years:o.info.cons.years};
  (o.papers||[]).forEach(x=>{ if(x.rel) x.rel.missing = (x.rel.missing||[]).map(consByLabel).filter(Boolean); x.authorIds = new Set(); x.refIds = []; });
  o.watch = o.watch || [];
  return o;
}
function saveProjects(){
  const real = projects.filter(pr=>pr.live && !pr.offline).slice(0, 25);
  for(let n = real.length; n > 0; n--){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(real.slice(0, n).map(serializeProject))); return; }
    catch(e){ /* Speicher voll: ältere Projekte weglassen */ }
  }
}
function loadProjects(){
  try{
    const arr = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    projects = arr.map(reviveProject);
    let maxId = 999; projects.forEach(pr=>pr.papers.forEach(x=>{ if(x.id > maxId) maxId = x.id; })); nextId = maxId + 1;
  }catch(e){ projects = []; }
}
function inWatch(x){ return !!(current && current.watch && current.watch.includes(x.id)); }
function toggleWatch(id, ev){
  if(ev) ev.stopPropagation();
  if(!current) return;
  current.watch = current.watch || [];
  const i = current.watch.indexOf(id);
  if(i >= 0){ current.watch.splice(i,1); toast(t('t_watch_removed')); } else { current.watch.push(id); toast(t('t_watch_added')); }
  saveProjects(); rerenderOpen(); if(document.querySelector('.screen.active').id==='watch') renderWatch();
}
function watchBtn(x){ if(!x.real) return ''; const on = inWatch(x); return `<button class="wbtn ${on?'on':''}" onclick="toggleWatch(${x.id}, event)">${t(on?'watch_in':'watch_add')}</button>`; }
function watchedPapers(){ return current && current.watch ? current.watch.map(id=>current.papers.find(x=>x.id===id)).filter(Boolean) : []; }
function renderWatchBar(p){
  const el = document.getElementById('watchBar');
  const n = (p.watch||[]).length;
  el.innerHTML = p.live ? `<span class="small muted">${t('saved_hint')}</span><button class="btn ghost" onclick="openWatch()">${t('watch_btn',{n})}</button>` : '';
}
function openWatch(){ renderWatch(); show('watch'); }
function renderWatch(){
  const list = watchedPapers();
  document.getElementById('watchSub').textContent = t('watch_sub',{n:list.length, p:titleOf(current)});
  document.getElementById('watchActions').style.display = list.length ? '' : 'none';
  document.getElementById('watchList').innerHTML = list.length ? list.map(x=>`
    <div class="card"><div class="citation">${esc(apaCitation(x))}</div>
    <button class="wbtn" onclick="toggleWatch(${x.id}, event)">${t('watch_remove')}</button></div>`).join('')
    : `<div class="card soft"><div class="small muted">${t('watch_empty')}</div></div>`;
}
// APA 7: Nachname, V. V., …, & Nachname, V. (Jahr). Titel. Zeitschrift, Band(Heft), Seiten. https://doi.org/…
function apaName2(n){ const parts = String(n).trim().split(/\s+/); if(parts.length<2) return n; const last = parts.pop(); return last+', '+parts.map(q=>q.split(/[.]/).filter(Boolean).map(c=>c[0].toUpperCase()+'.').join(' ')).join(' '); }
function apaCitation(x){
  const names = (x.authorList && x.authorList.length ? x.authorList : []).map(apaName2);
  let au = names.length===0 ? x.authors : names.length===1 ? names[0] : names.length<=20 ? names.slice(0,-1).join(', ')+', & '+names[names.length-1] : names.slice(0,19).join(', ')+', … '+names[names.length-1];
  const b = x.biblio || {}, jn = (x.source && x.source.name) || x.journal.split(',')[0];
  let src = jn; if(b.volume) src += ', '+b.volume+(b.issue?'('+b.issue+')':''); if(b.first) src += ', '+b.first+(b.last?'–'+b.last:'');
  return `${au} (${x.year}). ${String(x.title).replace(/\.$/,'')}. ${src}.` + (x.doi && x.doiStatus!=='bad' ? ` https://doi.org/${x.doi}` : '');
}
function copyApa(){
  const txt = watchedPapers().map(apaCitation).sort((a,b)=>a.localeCompare(b)).join('\n\n');
  try{ navigator.clipboard && navigator.clipboard.writeText(txt); }catch(e){}
  toast(t('t_apa_copied'));
}
function bibKey(x, i){ const last = ((x.authorList&&x.authorList[0])||'paper').split(/\s+/).pop().normalize('NFKD').replace(/[^A-Za-z]/g,'') || 'paper'; return last.toLowerCase()+(x.year||'')+String.fromCharCode(97+(i%26)); }
function bibEsc(v){ return String(v||'').replace(/[{}]/g,''); }
function toBib(list){
  return list.map((x,i)=>{
    const b = x.biblio||{}, f = [['author',(x.authorList||[]).map(n=>{const p=n.split(/\s+/); const l=p.pop(); return l+', '+p.join(' ');}).join(' and ')],['title',x.title],['journal',(x.source&&x.source.name)||''],['year',x.year],['volume',b.volume],['number',b.issue],['pages',b.first?(b.first+(b.last?'--'+b.last:'')):''],['doi',x.doi],['publisher',x.source&&x.source.publisher]];
    return '@article{'+bibKey(x,i)+',\n'+f.filter(e=>e[1]).map(e=>'  '+e[0]+' = {'+bibEsc(e[1])+'}').join(',\n')+'\n}';
  }).join('\n\n');
}
function toRis(list){
  return list.map(x=>{
    const b = x.biblio||{}, L2 = ['TY  - JOUR'];
    (x.authorList||[]).forEach(n=>{ const p = n.split(/\s+/); const l = p.pop(); L2.push('AU  - '+l+', '+p.join(' ')); });
    L2.push('TI  - '+x.title); if(x.source&&x.source.name) L2.push('JO  - '+x.source.name); L2.push('PY  - '+x.year);
    if(b.volume) L2.push('VL  - '+b.volume); if(b.issue) L2.push('IS  - '+b.issue); if(b.first) L2.push('SP  - '+b.first); if(b.last) L2.push('EP  - '+b.last);
    if(x.doi) L2.push('DO  - '+x.doi); if(x.source&&x.source.publisher) L2.push('PB  - '+x.source.publisher);
    L2.push('ER  - '); return L2.join('\r\n');
  }).join('\r\n\r\n');
}
function exportFile(kind){
  const list = watchedPapers(); if(!list.length) return;
  const data = kind==='bib' ? toBib(list) : toRis(list);
  const name = 'paperscout-'+(normText(titleOf(current)).replace(/\s+/g,'-').slice(0,40)||'liste')+'.'+kind;
  const blob = new Blob([data], {type: kind==='bib' ? 'application/x-bibtex' : 'application/x-research-info-systems'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast(t('t_export',{f:name}));
}

/* =========================================================
   HELFER
   ========================================================= */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}
placeLang();
loadProjects();
applyStatic();
renderSide();
</script>
